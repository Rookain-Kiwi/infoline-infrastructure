# ==============================================================================
# Deployment - Kibana
# ==============================================================================
# Déploie Kibana et le connecte à Elasticsearch via le Service ClusterIP.
# L'interface web est exposée à l'extérieur du cluster par kibana-service.yaml
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: elk-stack
  labels:
    app: kibana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
        component: monitoring
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.11.0
        ports:
        - containerPort: 5601
          name: http
          protocol: TCP
        env:
        # ELASTICSEARCH_HOSTS en variable d'environnement prend la priorité
        # sur la valeur elasticsearch.hosts définie dans kibana-configmap.yaml.
        # Les deux doivent pointer vers la même URL — toute désynchronisation
        # provoque une erreur ENOTFOUND au démarrage de Kibana.
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch:9200"
        - name: SERVER_NAME
          value: "kibana"
        - name: SERVER_HOST
          value: "0.0.0.0"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: kibana-config
          mountPath: /usr/share/kibana/config/kibana.yml
          subPath: kibana.yml
      volumes:
      - name: kibana-config
        configMap:
          name: kibana-config