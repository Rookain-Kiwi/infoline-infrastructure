# ==============================================================================
# Service - Kibana
# ==============================================================================
# Expose Kibana via un LoadBalancer AWS (ELB) pour l'accès depuis le navigateur.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kibana-svc
  namespace: elk-stack
  labels:
    app: kibana
    component: monitoring
spec:
  type: LoadBalancer  # Provisionne un ELB AWS — accessible via l'URL affichée dans EXTERNAL-IP
  ports:
  - port: 5601
    targetPort: 5601
    protocol: TCP
    name: http
  selector:
    app: kibana