# ==============================================================================
# ConfigMap - Kibana
# ==============================================================================
# Fournit le fichier de configuration kibana.yml monté dans le conteneur.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: elk-stack
  labels:
    app: kibana
    component: monitoring
data:
  kibana.yml: |
    server.host: "0.0.0.0"
    server.name: "kibana"
    # Nom DNS du Service Kubernetes Elasticsearch (pas une IP) —
    # résolu automatiquement par CoreDNS à l'intérieur du cluster.
    elasticsearch.hosts: ["http://elasticsearch:9200"]
    monitoring.ui.container.elasticsearch.enabled: true