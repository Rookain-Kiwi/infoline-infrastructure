apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: elk-stack
  labels:
    app: kibana
    component: monitoring
data:
  kibana.yml: |
    server.host: "0.0.0.0"
    server.name: "kibana"
    elasticsearch.hosts: ["http://elasticsearch:9200"]
    monitoring.ui.container.elasticsearch.enabled: true