# ==============================================================================
# Service - Elasticsearch
# ==============================================================================
# Expose Elasticsearch en interne au cluster uniquement.
# Kibana et les autres pods du namespace elk-stack l'atteignent via
# le nom DNS stable : http://elasticsearch:9200
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: elk-stack
  labels:
    app: elasticsearch
    component: monitoring
spec:
  # ClusterIP : pas d'exposition externe — Elasticsearch n'est accessible
  # que depuis l'intérieur du cluster.
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      protocol: TCP
      name: http
    - port: 9300
      targetPort: 9300
      protocol: TCP
      name: transport  # Communication interne entre nœuds — requis par Elasticsearch
                       # même en mode single-node
  selector:
    app: elasticsearch