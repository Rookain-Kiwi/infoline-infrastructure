# ==============================================================================
# StatefulSet - Elasticsearch
# ==============================================================================
# StatefulSet plutôt que Deployment : garantit une identité réseau stable
# (elasticsearch-0) et un PersistentVolume dédié qui survit aux redémarrages
# du pod.
# ==============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: elk-stack
  labels:
    app: elasticsearch
    component: monitoring
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        component: monitoring
    spec:
      initContainers:
      - name: fix-permissions
        # InitContainer exécuté avant le conteneur principal.
        # Problème : le volume EBS est monté avec les permissions root par défaut,
        # or Elasticsearch s'exécute sous l'UID 1000 et refuse de démarrer
        # si son répertoire de données ne lui appartient pas.
        # Solution : chown 1000:1000 avant le démarrage d'Elasticsearch.
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          chown -R 1000:1000 /usr/share/elasticsearch/data
          chmod -R 775 /usr/share/elasticsearch/data
        securityContext:
          runAsUser: 0  # Root requis pour modifier les permissions du volume EBS
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
        ports:
        - containerPort: 9200
          name: http
          protocol: TCP
        - containerPort: 9300
          name: transport
          protocol: TCP
        env:
        - name: discovery.type
          value: "single-node"  # Mode nœud unique — pas de formation de cluster multi-nœuds
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"  # Heap JVM fixe à 512MB — requis sur t3.medium
                                      # (t3.small provoquait des OOMKilled)
        # Sécurité désactivée pour simplifier la configuration en environnement de dev.
        - name: xpack.security.enabled
          value: "false"
        - name: xpack.security.enrollment.enabled
          value: "false"
        - name: xpack.security.http.ssl.enabled
          value: "false"
        - name: xpack.security.transport.ssl.enabled
          value: "false"
        - name: bootstrap.memory_lock
          value: "false"
        resources:
          requests:
            memory: "1Gi"   # Elasticsearch réserve 512MB heap + overhead JVM
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: elasticsearch-data
          mountPath: /usr/share/elasticsearch/data
  # volumeClaimTemplates : Kubernetes crée automatiquement un PVC par pod du StatefulSet.
  # Le PVC elasticsearch-data-elasticsearch-0 est provisionné dynamiquement
  # via l'EBS CSI Driver (installé via Helm dans startup-infra.sh).
  volumeClaimTemplates:
  - metadata:
      name: elasticsearch-data
    spec:
      accessModes: [ "ReadWriteOnce" ]  # Un seul nœud en lecture/écriture — adapté au single-node
      storageClassName: gp2             # EBS gp2 (provisionnement dynamique via EBS CSI Driver)
      resources:
        requests:
          storage: 5Gi